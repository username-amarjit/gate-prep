<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GATE CS/IT — AI Prep</title>
  <meta name="description" content="AI-assisted GATE CS/IT preparation: notes, diagrams and adaptive quizzing." />
  <!-- Reasonable CSP for a personal static app. Allows the CDN libs, GitHub API,
       the local proxy, and math/diagram assets; no inline scripts of our own. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net 'unsafe-eval';
    style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    font-src 'self' https://cdn.jsdelivr.net;
    img-src 'self' data: blob: https:;
    connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
    worker-src 'self' blob:;
  " />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <noscript>This app needs JavaScript.</noscript>
    <p style="padding:2rem;text-align:center;color:#888">Loading…</p>
  </div>

  <!-- Third-party libraries (UMD globals). -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hash-wasm@4/dist/index.umd.min.js"></script>

  <!-- App data + modules (load order matters; classic scripts, no bundler). -->
  <script src="data/seed.js"></script>
  <script src="js/lib.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/elo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/github.js"></script>
  <script src="js/generate.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
